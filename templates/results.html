{{if .YearlyData}}
<div class="total-backpay">
	<h2>Total Backpay</h2>
	<div class="amount">${{formatCurrency .TotalBackpay}}</div>
</div>

<div class="results-actions" style="margin-bottom: 1rem; display: flex; gap: 1rem;">
	<button id="save-btn" class="btn-secondary" style="flex: 1;">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 1rem; height: 1rem; margin-right: 0.5rem; vertical-align: middle;">
			<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
			<polyline points="17 21 17 13 7 13 7 21"/>
			<polyline points="7 3 7 8 15 8"/>
		</svg>
		Save Calculation
	</button>
	<button id="email-btn" class="btn-secondary" style="flex: 1;" onclick="showEmailModal()">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 1rem; height: 1rem; margin-right: 0.5rem; vertical-align: middle;">
			<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
			<polyline points="22,6 12,13 2,6"/>
		</svg>
		Email Results
	</button>
</div>

<div class="card">
	<table>
		<thead>
			<tr>
				<th>Year</th>
				<th>Monthly Payment</th>
				<th>Yearly Total</th>
			</tr>
		</thead>
		<tbody>
			{{range .YearlyData}}
			<tr>
				<td>{{.Year}}</td>
				<td class="amount-cell">${{formatCurrency .MonthlyRate}}</td>
				<td class="amount-cell">${{formatCurrency .YearTotal}}</td>
			</tr>
			{{end}}
		</tbody>
	</table>
</div>
{{end}}
